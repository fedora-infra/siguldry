[package]
name = "siguldry-fedora-autopen"
license = "MIT"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.2.2"
readme = "README.md"
description = """
An AMQP client to auto-sign Fedora build artifacts
"""
keywords = ["rpmsign", "amqp", "siguldry", "fedora"]
repository = "https://github.com/fedora-infra/siguldry"

[dependencies.anyhow]
workspace = true

[dependencies.clap]
workspace = true
features = ["std", "derive", "env", "help", "usage", "error-context"]

[dependencies.hex]
workspace = true

[dependencies.lapin]
version = "4.4"
default-features = false
features = ["tokio", "openssl"]

[dependencies.metrics]
version = "0.24.6"

[dependencies.metrics-exporter-prometheus]
version = "0.18.3"
default-features = false
features = ["http-listener"]

[dependencies.openssl]
workspace = true

# Used for RPM signing to interact with Koji via its Python library
[dependencies.pyo3]
workspace = true
features = ["auto-initialize"]

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["http2", "native-tls"]

[dependencies.rustix]
workspace = true
features = ["process"]

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[dependencies.siguldry]
workspace = true

[dependencies.tempfile]
workspace = true

[dependencies.time]
version = "0.3"
features = ["formatting"]

[dependencies.tokio]
workspace = true
features = ["fs", "macros", "net", "process", "rt-multi-thread", "io-std", "signal", "time"]

[dependencies.tokio-util]
workspace = true
features = ["io", "rt"]

[dependencies.tokio-stream]
version = "0.1"

[dependencies.toml]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true
features = ["std", "registry", "fmt", "env-filter"]

[dependencies.uuid]
workspace = true
features = ["v4", "v7", "serde"]

[dev-dependencies.wiremock]
version = "0.6"

[dev-dependencies.siguldry-test]
workspace = true

[dev-dependencies.tracing-test]
workspace = true
# env filtering breaks usage in integration tests
features = ["no-env-filter"]


[lints]
workspace = true
