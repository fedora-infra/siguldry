[package]
name = "siguldry"
license = "MIT"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.9.0"
readme = "README.md"
description = """
A signing server and client.
"""
keywords = ["pesign", "sigul", "fedora"]
repository = "https://github.com/fedora-infra/siguldry"

[lints]
workspace = true

[features]
default = ["server", "cli"]
# Enable the server APIs
server = ["dep:cryptoki", "dep:sqlx", "dep:rustix"]
# Build command-line interfaces for enabled components
cli = ["dep:clap", "dep:tracing-subscriber", "tokio/rt-multi-thread", "rustix/process", "rustix/fs"]

# Build the Sigul 1.2 client
sigul-client = []


[dependencies.anyhow]
workspace = true

[dependencies.asn1]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.clap]
workspace = true
features = ["std", "derive", "env", "help", "usage", "error-context"]
optional = true

[dependencies.cryptoki]
workspace = true
optional = true

[dependencies.hex]
workspace = true

# Needed for openssl-sys and should be dropped as a direct dependency when
# openssl-sys is dropped.
[dependencies.foreign-types]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.openssl]
workspace = true

# The main openssl crate still doesn't support signing with ML-DSA keys.
# With great care we can use the bindings directly. This does restrict support
# to OpenSSL exclusively. Once the high level openssl crate supports ML-DSA
# signatures this dependency and the dependency on foreign-types should be
# dropped.
[dependencies.openssl-sys]
version = "0.9.117"
default-features = false

[dependencies.rustix]
workspace = true
features = ["termios", "stdio"]
optional = true

[dependencies.serde]
workspace = true
features = ["derive"]

# As we use OpenSSL for the TLS connection, let's stick with it for this as well.
# The upstream default engine is nettle.
[dependencies.sequoia-openpgp]
workspace = true
features = ["crypto-openssl"]

[dependencies.serde_json]
workspace = true

[dependencies.sqlx]
version = "0.9"
features = ["runtime-tokio", "sqlite-unbundled", "macros", "migrate"]
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
workspace = true
features = ["macros", "net", "process", "rt", "io-util", "io-std", "signal", "time"]

[dependencies.tokio-util]
workspace = true
features = ["io", "rt"]

[dependencies.tokio-openssl]
version = "0.6"

# Used for deserializing the configuration file
[dependencies.toml]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true
features = ["std", "registry", "fmt", "env-filter"]
optional = true

# Used to generate unique IDs for each request
[dependencies.uuid]
workspace = true
features = ["v7", "serde"]

[dependencies.zerocopy]
workspace = true
features = ["std", "derive"]


[dev-dependencies]
anyhow.workspace = true
assert_cmd.workspace = true
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
toml.workspace = true

[dev-dependencies.siguldry-test]
workspace = true

[dev-dependencies.tracing-test]
workspace = true
# env filtering breaks usage in integration tests
features = ["no-env-filter"]

[dev-dependencies.pyo3]
workspace = true
features = ["auto-initialize"]

[dev-dependencies.sequoia-openpgp]
workspace = true
features = ["crypto-openssl"]


[[bench]]
name = "end_to_end"
harness = false


[[bin]]
name = "siguldry-client"
required-features = ["cli"]

[[bin]]
name = "siguldry-server"
required-features = ["server", "cli"]

[[bin]]
name = "siguldry-signer"
required-features = ["server", "cli"]

[[bin]]
name = "siguldry-bridge"
required-features = ["cli"]
