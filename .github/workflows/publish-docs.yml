name: Publish documentation

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Publish documentation to GitHub Pages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # 2.87.13
        with:
          tool: mdbook

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            make

      - name: Build documentation assets
        working-directory: docs
        run: make all

      - name: Build docs
        working-directory: docs
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # 6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # 5.0.0
        with:
          path: docs/book

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # 5.0.0
