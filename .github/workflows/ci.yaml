name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 0 * * SUN"

jobs:
  audit:
    name: Cargo dependency checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fcf085fcb4b4b8f63f96906cd713eb52181b5ea4
        id: rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2

      - name: Install cargo-deny
        run: |
          cargo install --locked cargo-deny

      - name: Check for security advisories
        run: cargo deny --log-level info --workspace check --show-stats advisories

      - name: Check for unexpected licenses from dependencies
        run: cargo deny --log-level info --workspace check --show-stats licenses

      - name: Check crates are from expected sources
        run: cargo deny --log-level info --workspace check --show-stats sources

  zizmor:
    name: GitHub Actions lints
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # 2.87.10
        with:
          tool: zizmor

      - name: Run zizmor 🌈
        run: zizmor .

  style:
    name: Code style checks
    runs-on: ubuntu-26.04
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fcf085fcb4b4b8f63f96906cd713eb52181b5ea4
        id: rust-toolchain
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Install test packages
        run: |
          dnf install -y --enablerepo=updates-testing \
            acl \
            clang \
            gnupg-pkcs11-scd \
            kryoptic \
            opensc \
            openssl \
            openssl-devel \
            ostree \
            pesign \
            pkcs11-provider \
            pkg-config \
            python3-devel \
            python3-koji \
            sequoia-sq \
            sqlite-devel

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings

  generate-sigul-data:
    name: Generate a Sigul data directory for migration
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fcf085fcb4b4b8f63f96906cd713eb52181b5ea4
        id: rust-toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            podman
          pip3 install podman-compose

      - name: Generate sigul data
        run: cargo xtask generate-sigul-data

      - name: Upload sigul data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: sigul-data
          path: devel/sigul-data/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test:
    name: Unit and integration tests
    needs: generate-sigul-data
    runs-on: ubuntu-26.04
    container:
      image: ${{ matrix.container-image }}
    strategy:
      matrix:
        container-image:
          - quay.io/fedora/fedora:44
        # Support current stable and the toolchain that ships with
        # the latest RHEL 10 minor release. 10.1 targets 1.88.
        rust-toolchain: [stable, "1.88"]
        include:
          - container-image: quay.io/almalinuxorg/almalinux:10.2
            rust-toolchain: system
          - container-image: quay.io/centos/centos:stream10
            rust-toolchain: system
          - container-image: quay.io/fedora/fedora:45
            rust-toolchain: stable
          - container-image: quay.io/fedora/fedora:rawhide
            rust-toolchain: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Download sigul data artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: sigul-data
          path: devel/sigul-data/

      - name: Install system Rust toolchain
        if: matrix.rust-toolchain == 'system'
        run: dnf install -y rust cargo

      - uses: dtolnay/rust-toolchain@fcf085fcb4b4b8f63f96906cd713eb52181b5ea4
        if: matrix.rust-toolchain != 'system'
        id: rust-toolchain
        with:
          toolchain: ${{matrix.rust-toolchain}}
          components: clippy, rustfmt
      - name: Install nextest
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # 2.87.10
        with:
          tool: nextest@0.9

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2
        with:
          prefix-key: "${{ matrix.container-image }}"

      - name: Enable EPEL and CRB
        if: ${{ !startsWith(matrix.container-image, 'quay.io/fedora/') }}
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb

      - name: Install test packages
        run: |
          dnf install -y \
            acl \
            clang \
            gnupg-pkcs11-scd \
            kryoptic \
            opensc \
            openssl \
            openssl-devel \
            ostree \
            pesign \
            pkcs11-provider \
            pkg-config \
            python3-devel \
            python3-koji \
            sequoia-sq \
            sqlite-devel

          # pesign-client doesn't let you configure the socket location, so make it available to the world
          mkdir -p /run/pesign/
          chmod -R 777 /run/pesign/

      - name: cargo build
        run: cargo build

      - name: Install PKCS#11 module for autopen integration tests
        run: |
          install -D -p -m 0755 target/debug/libsiguldry_pkcs11.so /usr/lib64/pkcs11/libsiguldry_pkcs11.so
          echo "module: libsiguldry_pkcs11.so" > /usr/share/p11-kit/modules/siguldry.module

      - name: Run unit tests
        run: cargo nextest run

      - name: Check manual is up-to-date
        run: cargo xtask manual && test -z "$(git status --porcelain)"

  legacy-integration-tests:
    name: Sigul integration tests
    runs-on: ubuntu-26.04
    container: quay.io/jeremycline/sigul-pesign-bridge-ci:2026-07-06
    services:
      sigul-bridge:
        image: quay.io/jeremycline/sigul-pesign-bridge-ci:2026-07-06
        env:
          RUN_SIGUL_BRIDGE: true
        volumes:
          - ./devel/github:/etc/sigul
        options: >-
          --health-cmd "ss -o state established '( sport = :44333 )' && ss -lnt '( sport = :44334 )'"
          --health-timeout 3s
          --health-interval 5s
          --health-retries 5

      sigul-server:
        image: quay.io/jeremycline/sigul-pesign-bridge-ci:2026-07-06
        env:
          RUN_SIGUL_SERVER: true
        volumes:
          - ./devel/github:/etc/sigul
        options: >-
          --health-cmd "ss -tn -o state established '( dport = :44333 )'"
          --health-timeout 3s
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install nextest
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # 2.87.10
        with:
          tool: nextest@0.9

      - name: Integration tests
        run: |
          set -xeuo pipefail

          # Gross hack; delete the siguldry-test crate since it depends on the server
          # which has non-RHEL9 dependencies. We don't use the crate for legacy sigul
          # tests.
          sed -i '/^\[dev-dependencies\.siguldry-test\]$/,+2d' siguldry/Cargo.toml

          # The sample UEFI application is baked into the image.
          cp -r /srv/siguldry/target .
          mkdir -p /run/pesign/
          export RUNTIME_DIRECTORY=/run/pesign
          export CREDENTIALS_DIRECTORY=/srv/siguldry/creds/
          export SIGUL_PESIGN_BRIDGE_CONFIG=$(pwd)/devel/github/config.toml
          export RUST_BACKTRACE=1
          pushd siguldry
          cargo nextest --profile sigul run --no-default-features --features "sigul-client"
          popd
          pushd sigul-pesign-bridge
          cargo nextest --profile sigul run
          popd
